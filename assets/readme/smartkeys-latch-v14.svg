<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="t d"><title id="t">Smart Keys double-tap latch</title><desc id="d">Visual guide showing how to double tap a Smart Key pad or double press a number key to hold a chord.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090e"/><stop offset="1" stop-color="#11152a"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c084fc"/><stop offset=".5" stop-color="#8b7cff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="600" rx="40" fill="url(#bg)"/><text x="74" y="76" fill="#9ba2b4" font-family="Inter,Arial" font-size="16" font-weight="850" letter-spacing="4">SMART KEYS • HANDS-FREE HARMONY</text><text x="74" y="136" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="850">Double-tap. Hold the chord. Keep playing.</text><text x="74" y="176" fill="#929aab" font-family="Inter,Arial" font-size="21">Works with touch, mouse/trackpad, and the mapped number keys 1–7.</text><g transform="translate(74 230)"><g><circle cx="82" cy="82" r="62" fill="#171b25" stroke="#303747" stroke-width="3"/><text x="82" y="69" text-anchor="middle" fill="#8d95a5" font-family="Inter,Arial" font-size="13" font-weight="800">TAP</text><text x="82" y="98" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="23" font-weight="850">Cmaj9</text><text x="82" y="121" text-anchor="middle" fill="#747d8e" font-family="Inter,Arial" font-size="12">plays normally</text></g><path d="M166 82H248" stroke="#454c5c" stroke-width="4" stroke-linecap="round"/><path d="M237 72l14 10-14 10" fill="none" stroke="#454c5c" stroke-width="4"/><g transform="translate(270)"><circle cx="82" cy="82" r="62" fill="#1e1a35" stroke="#8b7cff" stroke-width="4"/><circle cx="82" cy="82" r="70" fill="none" stroke="#8b7cff" opacity=".18" stroke-width="8"/><text x="82" y="64" text-anchor="middle" fill="#c9c2ff" font-family="Inter,Arial" font-size="13" font-weight="850">DOUBLE TAP</text><text x="82" y="97" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="23" font-weight="850">Cmaj9</text><rect x="48" y="113" width="68" height="24" rx="12" fill="#8b7cff"/><text x="82" y="130" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="10" font-weight="900" letter-spacing="1.5">HELD</text></g><path d="M440 82H522" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/><path d="M511 72l14 10-14 10" fill="none" stroke="#8b7cff" stroke-width="4"/><g transform="translate(540)"><rect width="430" height="164" rx="26" fill="#11151e" stroke="#2a3040"/><text x="26" y="38" fill="#8f97a8" font-family="Inter,Arial" font-size="13" font-weight="850" letter-spacing="2">NOW YOUR HAND IS FREE</text><g transform="translate(26 62)"><rect width="378" height="78" rx="13" fill="#f4f5f8"/><g fill="#0c0e12"><rect x="49" width="31" height="49" rx="3"/><rect x="107" width="31" height="49" rx="3"/><rect x="223" width="31" height="49" rx="3"/><rect x="281" width="31" height="49" rx="3"/></g></g></g><g transform="translate(1012)"><rect width="438" height="164" rx="26" fill="#10141d" stroke="#2c3342"/><text x="25" y="38" fill="#929aab" font-family="Inter,Arial" font-size="13" font-weight="850" letter-spacing="2">KEYBOARD SHORTCUT</text><g transform="translate(26 58)"><rect width="72" height="72" rx="15" fill="#202633" stroke="#4a5264" stroke-width="2"/><text x="36" y="48" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="29" font-weight="850">3</text><text x="102" y="45" fill="#7d8596" font-family="Inter,Arial" font-size="22">+</text><rect x="132" width="72" height="72" rx="15" fill="#2a2450" stroke="#8b7cff" stroke-width="2"/><text x="168" y="48" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="29" font-weight="850">3</text><text x="228" y="31" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="850">double-press</text><text x="228" y="56" fill="#8d95a5" font-family="Inter,Arial" font-size="14">to latch chord 3</text></g></g><text x="74" y="462" fill="#c9c3ff" font-family="Inter,Arial" font-size="17" font-weight="850">Release:</text><text x="153" y="462" fill="#949cad" font-family="Inter,Arial" font-size="17">double-tap the held chord again, double-tap another chord to switch, or stop the session.</text><g transform="translate(74 502)"><rect width="1452" height="54" rx="17" fill="#0c1018" stroke="#222938"/><circle cx="28" cy="27" r="6" fill="#8b7cff" filter="url(#glow)"/><text x="49" y="34" fill="#dfe2ea" font-family="Inter,Arial" font-size="16" font-weight="750">Arp Lab enabled?</text><text x="190" y="34" fill="#8f97a8" font-family="Inter,Arial" font-size="16">The same double-tap gesture latches the current arpeggio target instead of a sustained chord.</text></g></g></svg>