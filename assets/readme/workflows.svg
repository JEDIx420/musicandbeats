<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Music &amp; Beats Play and Record workflows</title><desc id="d">Visual comparison of instant Play mode and guided layer-by-layer Record mode.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#10131d"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5fb7ff"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7ea8"/><stop offset="1" stop-color="#8b7cff"/></linearGradient></defs><rect width="1600" height="760" rx="34" fill="url(#bg)"/><text x="70" y="80" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="850">Two ways to use Music &amp; Beats</text><text x="70" y="116" fill="#9299aa" font-family="Inter,Arial" font-size="19">Play when you want to jam. Record when you want to build a reusable loop session.</text><g font-family="Inter,Arial"><g transform="translate(70 165)"><rect width="710" height="510" rx="30" fill="#141822" stroke="#302a52"/><circle cx="55" cy="52" r="28" fill="url(#p)"/><text x="47" y="60" fill="#fff" font-size="22">▶</text><text x="100" y="55" fill="#fff" font-size="31" font-weight="850">PLAY MODE</text><text x="100" y="84" fill="#9aa2b3" font-size="15">Instant performance. No project setup required.</text><g transform="translate(38 128)"><rect width="190" height="74" rx="18" fill="#1e2230"/><text x="20" y="30" fill="#8d96a7" font-size="10" font-weight="800" letter-spacing="2">STEP 1</text><text x="20" y="55" fill="#fff" font-size="18" font-weight="800">Pick a groove</text><path d="M202 37h44" stroke="#4c5362" stroke-width="3"/><path d="M238 29l10 8-10 8" fill="none" stroke="#4c5362" stroke-width="3"/><g transform="translate(258)"><rect width="190" height="74" rx="18" fill="#1e2230"/><text x="20" y="30" fill="#8d96a7" font-size="10" font-weight="800" letter-spacing="2">STEP 2</text><text x="20" y="55" fill="#fff" font-size="18" font-weight="800">Choose instrument</text></g><path d="M460 37h44" stroke="#4c5362" stroke-width="3"/><path d="M496 29l10 8-10 8" fill="none" stroke="#4c5362" stroke-width="3"/><g transform="translate(516)"><rect width="156" height="74" rx="18" fill="#261f43" stroke="#6d5bd8"/><text x="20" y="30" fill="#bdb5ff" font-size="10" font-weight="800" letter-spacing="2">STEP 3</text><text x="20" y="55" fill="#fff" font-size="18" font-weight="800">Jam</text></g></g><g transform="translate(38 235)"><text fill="#9aa2b3" font-size="11" font-weight="800" letter-spacing="2">WHAT YOU CAN PLAY</text><g transform="translate(0 26)"><rect width="145" height="64" rx="16" fill="#241e3d"/><text x="20" y="29" fill="#c4b5fd" font-size="16" font-weight="800">Smart Keys</text><text x="20" y="49" fill="#7f8796" font-size="11">editable chords</text><g transform="translate(158)"><rect width="145" height="64" rx="16" fill="#31220f"/><text x="20" y="29" fill="#f8c983" font-size="16" font-weight="800">Guitar</text><text x="20" y="49" fill="#8e7c65" font-size="11">amps + pedals</text></g><g transform="translate(316)"><rect width="145" height="64" rx="16" fill="#1f2518"/><text x="20" y="29" fill="#c7e89f" font-size="16" font-weight="800">Bass</text><text x="20" y="49" fill="#7f8d75" font-size="11">multiple sounds</text></g><g transform="translate(474)"><rect width="145" height="64" rx="16" fill="#102a33"/><text x="20" y="29" fill="#7ce9f6" font-size="16" font-weight="800">Arp Lab</text><text x="20" y="49" fill="#6d8790" font-size="11">rhythmic chords</text></g></g><g transform="translate(0 116)"><text fill="#9aa2b3" font-size="11" font-weight="800" letter-spacing="2">BEST FOR</text><text y="35" fill="#fff" font-size="19" font-weight="750">Jamming · rehearsing · writing chords · trying grooves · live play</text></g></g></g><g transform="translate(820 165)"><rect width="710" height="510" rx="30" fill="#141822" stroke="#553047"/><circle cx="55" cy="52" r="28" fill="url(#r)"/><circle cx="55" cy="52" r="10" fill="#fff"/><text x="100" y="55" fill="#fff" font-size="31" font-weight="850">RECORD MODE</text><text x="100" y="84" fill="#9aa2b3" font-size="15">Guided loop building with bars, layers, timeline and projects.</text><g transform="translate(38 128)"><rect width="118" height="72" rx="18" fill="#1e2230"/><text x="17" y="29" fill="#8d96a7" font-size="10" font-weight="800">SET BPM</text><text x="17" y="54" fill="#fff" font-size="19" font-weight="800">100</text><path d="M129 36h34" stroke="#4c5362" stroke-width="3"/><path d="M155 29l9 7-9 7" fill="none" stroke="#4c5362" stroke-width="3"/><g transform="translate(174)"><rect width="118" height="72" rx="18" fill="#1e2230"/><text x="17" y="29" fill="#8d96a7" font-size="10" font-weight="800">SET BARS</text><text x="17" y="54" fill="#fff" font-size="19" font-weight="800">4</text></g><path d="M303 36h34" stroke="#4c5362" stroke-width="3"/><path d="M329 29l9 7-9 7" fill="none" stroke="#4c5362" stroke-width="3"/><g transform="translate(348)"><rect width="132" height="72" rx="18" fill="#1e2230"/><text x="17" y="29" fill="#8d96a7" font-size="10" font-weight="800">LAYER 1</text><text x="17" y="54" fill="#fff" font-size="18" font-weight="800">Beat</text></g><path d="M491 36h34" stroke="#4c5362" stroke-width="3"/><path d="M517 29l9 7-9 7" fill="none" stroke="#4c5362" stroke-width="3"/><g transform="translate(536)"><rect width="136" height="72" rx="18" fill="#312033" stroke="#8b4d73"/><text x="17" y="29" fill="#f5a2c1" font-size="10" font-weight="800">NEXT</text><text x="17" y="54" fill="#fff" font-size="18" font-weight="800">Layer 2…</text></g></g><g transform="translate(38 232)"><text fill="#9aa2b3" font-size="11" font-weight="800" letter-spacing="2">EXAMPLE SESSION</text><g transform="translate(0 27)"><g><rect width="632" height="42" rx="10" fill="#201a2c"/><rect width="632" height="42" rx="10" fill="#7c3aed" opacity=".32"/><text x="14" y="26" fill="#e6ddff" font-size="14" font-weight="750">1 · Beat</text></g><g transform="translate(0 50)"><rect width="632" height="42" rx="10" fill="#17202d"/><rect width="632" height="42" rx="10" fill="#0ea5e9" opacity=".26"/><text x="14" y="26" fill="#c6edff" font-size="14" font-weight="750">2 · Voice</text></g><g transform="translate(0 100)"><rect width="632" height="42" rx="10" fill="#2a2115"/><rect width="632" height="42" rx="10" fill="#f59e0b" opacity=".23"/><text x="14" y="26" fill="#ffe4a8" font-size="14" font-weight="750">3 · Guitar</text></g><g transform="translate(0 150)"><rect width="632" height="42" rx="10" fill="#1f1b32"/><rect width="632" height="42" rx="10" fill="#8b5cf6" opacity=".25"/><text x="14" y="26" fill="#ddd2ff" font-size="14" font-weight="750">4 · Smart Keys</text></g></g><text y="246" fill="#9aa2b3" font-size="11" font-weight="800" letter-spacing="2">BEST FOR</text><text y="278" fill="#fff" font-size="19" font-weight="750">Looping · arranging · practicing parts · saving complete ideas</text></g></g></g></svg>