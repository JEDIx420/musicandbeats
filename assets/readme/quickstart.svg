<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">Music &amp; Beats quick start</title><desc id="d">Five simple steps to start making music in Music &amp; Beats.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0f"/><stop offset="1" stop-color="#111522"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c084fc"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="1600" height="620" rx="34" fill="url(#bg)"/><text x="70" y="82" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="850">Start making music in five steps</text><text x="70" y="118" fill="#9299aa" font-family="Inter,Arial" font-size="19">No DAW knowledge required. Open the app, choose a mode and follow the musical flow.</text><g font-family="Inter,Arial"><g transform="translate(70 175)"><rect width="270" height="330" rx="28" fill="#151923" stroke="#2a3040"/><circle cx="42" cy="42" r="22" fill="url(#g)"/><text x="35" y="50" fill="#fff" font-size="20" font-weight="850">1</text><text x="28" y="105" fill="#fff" font-size="25" font-weight="850">Open the app</text><text x="28" y="143" fill="#9aa2b3" font-size="16">Use Safari on iPad or</text><text x="28" y="168" fill="#9aa2b3" font-size="16">any modern desktop browser.</text><rect x="28" y="215" width="214" height="56" rx="16" fill="#202536"/><text x="48" y="249" fill="#d9d5ff" font-size="15" font-weight="750">Music &amp; Beats  ↗</text><text x="28" y="300" fill="#737d8e" font-size="13">Allow audio when prompted.</text></g><g transform="translate(365 175)"><rect width="270" height="330" rx="28" fill="#151923" stroke="#2a3040"/><circle cx="42" cy="42" r="22" fill="url(#g)"/><text x="35" y="50" fill="#fff" font-size="20" font-weight="850">2</text><text x="28" y="105" fill="#fff" font-size="25" font-weight="850">Choose a mode</text><text x="28" y="143" fill="#9aa2b3" font-size="16">Pick Play for instant jamming</text><text x="28" y="168" fill="#9aa2b3" font-size="16">or Record to build a loop.</text><rect x="28" y="215" width="98" height="58" rx="16" fill="#6d4be8"/><text x="54" y="251" fill="#fff" font-size="16" font-weight="800">PLAY</text><rect x="138" y="215" width="104" height="58" rx="16" fill="#2b1821" stroke="#733049"/><text x="153" y="251" fill="#ff9ab6" font-size="16" font-weight="800">RECORD</text></g><g transform="translate(660 175)"><rect width="270" height="330" rx="28" fill="#151923" stroke="#2a3040"/><circle cx="42" cy="42" r="22" fill="url(#g)"/><text x="35" y="50" fill="#fff" font-size="20" font-weight="850">3</text><text x="28" y="105" fill="#fff" font-size="25" font-weight="850">Start audio</text><text x="28" y="143" fill="#9aa2b3" font-size="16">Tap Start Audio once so the</text><text x="28" y="168" fill="#9aa2b3" font-size="16">low-latency engine can run.</text><circle cx="62" cy="242" r="30" fill="#8b7cff"/><circle cx="62" cy="242" r="9" fill="#e8e4ff"/><text x="105" y="249" fill="#fff" font-size="17" font-weight="800">START AUDIO</text><text x="28" y="300" fill="#737d8e" font-size="13">Headphones recommended.</text></g><g transform="translate(955 175)"><rect width="270" height="330" rx="28" fill="#151923" stroke="#2a3040"/><circle cx="42" cy="42" r="22" fill="url(#g)"/><text x="35" y="50" fill="#fff" font-size="20" font-weight="850">4</text><text x="28" y="105" fill="#fff" font-size="25" font-weight="850">Build your sound</text><text x="28" y="143" fill="#9aa2b3" font-size="16">Use Smart Keys, beats, bass,</text><text x="28" y="168" fill="#9aa2b3" font-size="16">guitar or a microphone.</text><g transform="translate(28 215)"><rect width="62" height="48" rx="12" fill="#251e43"/><text x="18" y="30" fill="#c4b5fd" font-size="19">🎹</text><rect x="72" width="62" height="48" rx="12" fill="#312211"/><text x="90" y="30" fill="#fbbf24" font-size="19">🎸</text><rect x="144" width="62" height="48" rx="12" fill="#12303b"/><text x="162" y="30" fill="#67e8f9" font-size="19">🥁</text></g><text x="28" y="300" fill="#737d8e" font-size="13">Everything stays in the browser.</text></g><g transform="translate(1250 175)"><rect width="270" height="330" rx="28" fill="#151923" stroke="#2a3040"/><circle cx="42" cy="42" r="22" fill="url(#g)"/><text x="35" y="50" fill="#fff" font-size="20" font-weight="850">5</text><text x="28" y="105" fill="#fff" font-size="25" font-weight="850">Save your project</text><text x="28" y="143" fill="#9aa2b3" font-size="16">Name your session and reopen</text><text x="28" y="168" fill="#9aa2b3" font-size="16">it later from Projects.</text><rect x="28" y="215" width="214" height="58" rx="16" fill="#171c24" stroke="#3f485b"/><text x="55" y="251" fill="#fff" font-size="16" font-weight="800">PROJECTS  →</text><text x="28" y="300" fill="#737d8e" font-size="13">Saved locally on this device.</text></g></g><text x="70" y="570" fill="#6f7888" font-family="Inter,Arial" font-size="14">Tip: on iPad, use Safari → Share → Add to Home Screen for the cleanest app-like experience.</text></svg>